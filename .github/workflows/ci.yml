name: CI - Intervention Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality and Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: intervention_manager_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d intervention_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-not-for-production-django-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: intervention_manager_test
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python -m pytest -q

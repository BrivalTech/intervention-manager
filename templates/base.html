{% load static %}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>
            {% block title %}Gestionnaire d'interventions{% endblock %}
        </title>

        <link rel="stylesheet" href="{% static 'css/variables.css' %}">
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
    </head>

    <body>
        <a class="skip-link" href="#main-content">
            Aller au contenu principal
        </a>

        <header class="site-header">
            <div class="container">
                <p class="site-title">Gestionnaire d'interventions</p>
                <nav aria-label="Navigation principale">
                    <ul class="nav-list">
                        <li>
                            <a href="{% url 'core:home' %}"
                                    {% if request.resolver_match.url_name == "home" %}
                                        aria-current="page"
                                    {% endif %}
                            >
                                Accueil
                            </a>
                        </li>
                        <li>
                            <a
                                href="{% url 'core:design-system' %}"
                                {% if request.resolver_match.url_name == "design-system" %}
                                    aria-current="page"
                                {% endif %}
                            >
                                Design System
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>

        <main id="main-content" tabindex="-1">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>Gestionnaire d'interventions</p>
            </div>
        </footer>
    </body>
</html>
